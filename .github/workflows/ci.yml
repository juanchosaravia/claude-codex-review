name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: for f in skills/review/scripts/*.sh tests/*.sh; do bash -n "$f"; done
      - name: Offline tests
        run: bash tests/run.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck -x -S warning skills/review/scripts/*.sh tests/*.sh
      - name: Manifest versions agree
        run: |
          p=$(python3 -c "import json;print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          m=$(python3 -c "import json;print(json.load(open('.claude-plugin/marketplace.json'))['plugins'][0]['version'])")
          echo "plugin.json=$p marketplace.json=$m"
          [ "$p" = "$m" ]

  validate:
    name: claude plugin validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate --strict .
